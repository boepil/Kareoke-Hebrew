<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Karaoke Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f3ecdf;
      --muted: #92a0b6;
      --accent: #e4b21d;
      --warn: #ff8f78;
      --line: rgba(255, 255, 255, 0.08);
      --r: 24px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --ui: "Aptos", "Segoe UI", sans-serif;
      --display: "Aptos Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font: 14px/1.45 var(--ui);
      background:
        radial-gradient(1200px 700px at 0% 0%, rgba(228, 178, 29, 0.12), transparent 54%),
        radial-gradient(900px 700px at 100% 0%, rgba(71, 119, 190, 0.10), transparent 48%),
        linear-gradient(180deg, #10151f 0%, #090c11 60%, #07090d 100%);
    }

    button, input, textarea, select { font: inherit; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 2px 14px;
      background: var(--accent);
      color: #241906;
      font-weight: 800;
      line-height: 1.45;
      cursor: pointer;
      min-width: 52px;
      text-align: center;
      direction: inherit;
      unicode-bidi: isolate;
    }
    button.secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    #zoomOut, #zoomIn, #zoomReset { padding: 3px 8px; font-size: 11px; min-width: 36px; }
    button.warn { background: var(--warn); color: #2b0d08; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); min-width: 52px; text-align: center; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    input, textarea, select {
      width: 100%;
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }
    .url-input {
      direction: ltr;
      unicode-bidi: plaintext;
      text-align: left;
    }
    textarea { min-height: 300px; resize: vertical; }

    .shell {
      width: min(1540px, calc(100vw - 28px));
      margin: 14px auto;
      padding: 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: var(--shadow);
    }
    .app {
      display: flex;
      gap: 20px;
      min-height: calc(100vh - 56px);
      align-items: start;
    }
    .rail {
      flex: 0 0 292px;
      width: 292px;
      min-width: 292px;
      z-index: 2;
      overflow: hidden;
    }
    .workspace {
      flex: 1;
      min-width: 0;
      z-index: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: start;
    }
    .workspace > .section {
      flex: 1;
      min-width: 0;
    }
    .rail > *, .workspace > * { min-width: 0; }
    .drawer {
      flex: 0 0 320px;
      width: 320px;
      min-width: 320px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      position: relative;
      height: 800px;
      min-height: 400px;
      resize: vertical;
      overflow: hidden;
    }
    .panel-toggle {
      position: absolute;
      top: 41px;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: 12px;
    }
    .panel-toggle:hover {
      background: transparent;
      color: var(--text);
    }
    .panel-toggle.left {
      left: 6px;
    }
    .panel-toggle.right {
      right: 6px;
    }
    .rail[hidden], .drawer[hidden] {
      display: none !important;
    }
    .drawer-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .drawer-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .drawer-tab:hover {
      color: var(--text);
    }
    .drawer-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .drawer-tab-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }
    .drawer-tab-content[hidden] {
      display: none;
    }
    .drawer-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      color: var(--muted);
      padding: 4px;
      min-width: auto;
    }
    .drawer-close:hover {
      color: var(--text);
      background: rgba(255,255,255,0.1);
    }
    .drawer-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .drawer-header-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .drawer-content {
      padding: 8px 0;
    }
    .drawer-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-section {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drawer-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .drawer-section textarea {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: var(--r);
      color: var(--text);
      padding: 8px;
      font: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
    }
    .drawer-section input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: var(--r);
      color: var(--text);
      padding: 8px;
      font: inherit;
      font-size: 13px;
    }
    .drawer-section button {
      align-self: flex-start;
    }
    .drawer-divider {
      height: 1px;
      background: var(--line);
      margin: 4px 16px;
    }
    .lyrics-line {
      display: flex;
      padding: 8px 16px;
      cursor: default;
      gap: 12px;
      align-items: flex-start;
    }
    .lyrics-line:hover {
      background: rgba(255,255,255,0.03);
    }
    .lyrics-line.active {
      background: rgba(228, 178, 29, 0.12);
      border-left: 3px solid var(--accent);
      padding-left: 13px;
    }
    .lyrics-line-number {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 24px;
      text-align: right;
      padding-top: 2px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .lyrics-line-number:hover {
      color: var(--accent);
      transform: scale(1.15);
    }
    .lyrics-line.active .lyrics-words {
      border-color: transparent;
    }
    .lyrics-words {
      flex: 1;
      font: 700 16px/1.4 var(--display);
      text-align: right;
      direction: rtl;
      background: transparent;
      border: 1px solid transparent;
      outline: none;
      padding: 0 4px;
      border-radius: 4px;
      min-width: 0;
      word-break: break-word;
    }
    .lyrics-words:focus {
      border-color: rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
    }
    .lyrics-word { display: inline; white-space: pre-wrap; }
    .lyrics-word.committed { color: var(--text); }
    .lyrics-word.uncommitted { color: var(--muted); }
    .lyrics-line.active .lyrics-word.committed { color: var(--accent); }
    .lyrics-line.active .lyrics-word.uncommitted { color: var(--muted); opacity: 0.6; }
    .drawer-footer {
      padding: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .drawer-footer button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
    .drawer-footer-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .shortcut-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: var(--muted);
      font-size: 12px;
      z-index: 10;
      opacity: 0.7;
    }
    .shortcut-hint[hidden] {
      display: none;
    }
    .section {
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      padding: 16px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 11px;
      font-weight: 800;
    }
    h1, h2, p { margin: 0; }
    h1 { font: 700 clamp(22px, 2.1vw, 30px) / 1.02 var(--display); letter-spacing: -0.03em; }
    h2 { font: 700 22px / 1.05 var(--display); letter-spacing: -0.02em; }
    .muted { color: var(--muted); }
    .stack, .actions { display: grid; gap: 12px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar-left, .toolbar-right { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
    .toolbar-middle {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 80px;
      padding: 0 8px;
      overflow: hidden;
    }
    .toolbar-middle .chip {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: rtl;
      unicode-bidi: isolate;
    }
    .toolbar.split { justify-content: space-between; align-items: center; }
    .toolbar-group { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
    .stem-mix {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      min-width: 150px;
    }
    .stem-mix input[type="range"] {
      width: 132px;
      accent-color: var(--accent);
      padding: 0;
      background: transparent;
      border: 0;
    }
    .field { display: grid; gap: 7px; }
    .title-block { display: grid; gap: 6px; margin-bottom: 10px; }
    .title-block h1 { white-space: nowrap; }
    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .field-link {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .field-link:hover {
      color: var(--accent);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 12px;
      min-width: 52px;
      text-align: center;
      justify-content: center;
    }
    .chip.ok { color: #d6f5d2; background: rgba(143, 208, 143, 0.16); }
    .chip.warn { color: #ffd1c5; background: rgba(255, 143, 120, 0.14); }
    .chip.selected {
      background: rgba(228, 178, 29, 0.14);
      border: 1px solid rgba(228, 178, 29, 0.2);
      font-weight: 700;
    }
    .chip.selected .selected-word-text { color: var(--accent); }
    .chip.selected .selected-word-count {
      color: var(--text);
      margin-inline-start: 1.1em;
    }

    .stage, .editor { display: grid; gap: 14px; }
    .preview {
      min-height: 280px;
      height: 280px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.05);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));
      padding: 18px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      contain: layout paint;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .preview.empty {
      align-items: center;
      direction: ltr;
      font: 500 17px/1.4 var(--ui);
      color: rgba(255,255,255,0.45);
    }
    .preview-scroll {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      transform: translateY(-50%);
    }
    .preview-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.24em;
      min-height: 1.2em;
      width: 100%;
      font: 700 clamp(30px, 3.4vw, 50px) / 1.14 var(--display);
      letter-spacing: -0.03em;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0;
      transform: scale(0.95);
    }
    .preview-line.past {
      opacity: 0;
      transform: translateY(-30px) scale(0.9);
      pointer-events: none;
    }
    .preview-line.current {
      opacity: 1;
      transform: scale(1);
    }
    .preview-line.upcoming {
      opacity: 0.34;
      font-size: clamp(24px, 2.6vw, 38px);
      transform: scale(1);
    }
    .preview-line.standby {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }
    .preview-word { opacity: 0.34; transition: opacity 120ms ease, color 120ms ease, transform 120ms ease; }
    .preview-word.hidden { visibility: hidden; opacity: 0; }
    .preview-word.done { color: rgba(243, 236, 223, 0.95); opacity: 1; }
    .preview-word.ghost { opacity: 0.35; }
    .preview-word.current {
      color: var(--accent);
      opacity: 1;
      transform: translateY(-1px);
      text-shadow: 0 0 18px rgba(228, 178, 29, 0.3);
    }

    .editor-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .project-title-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: 700 26px/1.1 var(--display);
      text-align: center;
      letter-spacing: -0.02em;
    }
    .project-title-input::placeholder {
      color: rgba(255,255,255,0.36);
    }
    .time-readout {
      display: inline-flex;
      align-items: center;
      min-width: 88px;
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .icon-button {
      min-width: 30px;
      padding-inline: 8px;
      font-size: 18px;
      line-height: 1;
    }
    .btn-group {
      display: flex;
      gap: 0;
    }
    .btn-group button:first-child {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .btn-group button:not(:first-child):not(:last-child) {
      border-radius: 0;
      border-left: 1px solid rgba(0, 0, 0, 0.2);
      border-right: 1px solid rgba(0, 0, 0, 0.2);
    }
    .btn-group button:last-child {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
    .wave-shell {
      position: relative;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(8, 11, 17, 0.9);
      padding: 18px 16px 14px;
      overflow: hidden;
      min-width: 0;
    }
    #waveCanvas {
      width: 100%;
      height: 240px;
      display: block;
    }
    .word-layer {
      position: relative;
      height: 94px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      overflow: visible;
    }
    .word {
      position: absolute;
      top: 18px;
      transform: none;
      padding: 0 4px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      min-width: 0;
      background: rgba(255, 255, 255, 0.03);
      color: rgba(214, 220, 230, 0.76);
      white-space: nowrap;
      cursor: default;
      user-select: none;
      direction: auto;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font: 700 20px/1 var(--display);
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
    }
    .word.draggable {
      cursor: grab;
    }
    .word.draggable:active {
      cursor: grabbing;
    }
    .word.active {
      color: var(--accent);
      background: rgba(228, 178, 29, 0.12);
      border: 1px solid rgba(228, 178, 29, 0.5);
      text-shadow: 0 0 18px rgba(228, 178, 29, 0.35);
      z-index: 4;
    }
    .word.active.draft {
      transform: translateY(50px);
      color: var(--warn);
      background: rgba(255, 143, 120, 0.12);
      border: 1px dashed rgba(255, 143, 120, 0.5);
      text-shadow: 0 0 18px rgba(255, 143, 120, 0.42);
    }
     .word.active.done { color: var(--accent); }
     .word.done { color: rgba(214, 220, 230, 0.84); }
     .word.ghost { opacity: 0.35; border-style: dotted; background: rgba(255, 255, 255, 0.01); cursor: pointer; }
     .word.dragging,
    .word.dragging.done,
    .word.active.dragging,
    .word.active.dragging.done {
      color: var(--warn);
      background: rgba(255, 143, 120, 0.2);
      border: 1px solid var(--warn);
      text-shadow: 0 0 18px rgba(255, 143, 120, 0.42);
      z-index: 2;
    }
    .resize-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: ew-resize;
      background: rgba(255, 255, 255, 0.1);
      z-index: 3;
    }
    .resize-handle-left {
      left: 0;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .resize-handle-right {
      right: 0;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }
    .resize-handle:hover, .resize-handle:active {
      background: rgba(228, 178, 29, 0.6);
    }

    .shared-boundary-handle {
      position: absolute;
      top: 18px; /* aligns with .word top */
      height: 38px; /* gives comfortable vertical height for grab */
      width: 12px;
      margin-left: -6px; /* center it exactly on the boundary */
      cursor: ew-resize;
      z-index: 10;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .shared-boundary-handle::after {
      content: "";
      width: 4px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      border-radius: 2px;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 0 10px var(--accent);
    }
    .shared-boundary-handle:hover::after,
    .shared-boundary-handle:active::after,
    .shared-boundary-handle.dragging::after {
      opacity: 1;
      transform: scaleX(1.5);
    }

    canvas {
      width: 100%;
      display: block;
      height: 240px;
      background: #090c12;
      border-radius: 16px;
      margin-top: 14px;
    }
    .playhead {
      position: absolute;
      top: 18px;
      bottom: 14px;
      width: 2px;
      left: 50%;
      background: var(--warn);
      pointer-events: auto;
      z-index: 3;
      cursor: ew-resize;
    }
    .playhead::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
      background: var(--warn);
    }
    .pan { margin-top: 12px; }
    .pan input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      padding: 0;
      background: transparent;
      border: 0;
    }
    .pipeline-stages {
      display: grid;
      gap: 8px;
    }
    .pipeline-stage {
      display: grid;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.03);
    }
    .pipeline-stage-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .pipeline-stage-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }
    .pipeline-stage-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pipeline-stage-status {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pipeline-stage-status.running {
      color: #ffd8b6;
      background: rgba(255, 143, 120, 0.14);
    }
    .pipeline-stage-status.done,
    .pipeline-stage-status.skipped {
      color: #d6f5d2;
      background: rgba(143, 208, 143, 0.16);
    }
    .pipeline-stage-status.pending {
      color: var(--muted);
    }
    .pipeline-stage-status.error {
      color: #ffd1c5;
      background: rgba(255, 143, 120, 0.18);
    }
    .pipeline-stage-bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .pipeline-stage-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(228, 178, 29, 0.65), rgba(255, 143, 120, 0.9));
      transition: width 160ms ease;
    }
    .pipeline-stage-fill.running {
      background-size: 200% 100%;
      background-image: linear-gradient(90deg, rgba(255, 143, 120, 0.55), rgba(228, 178, 29, 0.95), rgba(255, 143, 120, 0.55));
      animation: pipeline-shift 1.2s linear infinite;
    }
    .pipeline-stage-fill.done,
    .pipeline-stage-fill.skipped,
    .pipeline-stage-fill.error {
      width: 100%;
    }
    .pipeline-spin {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: var(--accent);
      animation: pipeline-spin 0.8s linear infinite;
      flex: none;
    }
    .pipeline-stage.done .pipeline-spin,
    .pipeline-stage.skipped .pipeline-spin,
    .pipeline-stage.pending .pipeline-spin,
    .pipeline-stage.error .pipeline-spin {
      animation: none;
      border-top-color: transparent;
      opacity: 0.35;
    }
    @keyframes pipeline-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pipeline-shift {
      from { background-position: 0 0; }
      to { background-position: 200% 0; }
    }
    .rail-divider {
      height: 1px;
      margin: 2px 0 4px;
      background: var(--line);
    }
    audio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* --- Sidebar layout --- */
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 2px;
    }
    .rail-header svg { flex: none; }
    .rail-header h2 {
      font: 700 18px/1.1 var(--display);
      color: var(--text);
      margin: 0;
    }

    /* Project name input with dropdown */
    .project-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .project-input-wrap input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.3);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: none;
    }
    .project-input-wrap input::placeholder { color: rgba(255,255,255,0.3); }
    .project-input-wrap select {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }
    .project-input-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      color: rgba(255,255,255,0.3);
    }

    /* Full-width primary button */
    .btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary.saved {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border: 1px solid var(--line);
    }

    /* Red outline button */
    .btn-danger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #fb7c5e;
      background: transparent;
      color: #fb7c5e;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-danger:hover { background: rgba(251,124,94,0.1); }
    .btn-danger:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Outline button */
    .btn-outline {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
    .btn-outline:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Side-by-side button row */
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; min-width: 0; }

    /* Reliable toggleable hide — overrides any inline display style */
    .btn-hidden { display: none !important; }

    /* Combined input field */
    .combined-input {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.3);
      min-height: 40px;
    }
    .combined-input input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
    }
    .combined-input input[type="text"]::placeholder { color: rgba(255,255,255,0.3); }
    .combined-input .browse-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin: 3px;
      white-space: nowrap;
    }
    .combined-input .browse-btn:hover { background: rgba(255,255,255,0.1); }
    .combined-input .icon-left {
      position: absolute;
      left: 10px;
      pointer-events: none;
      color: var(--muted);
    }
    .combined-input input[type="text"].has-icon { padding-left: 32px; }

    /* Status footer pill */
    .status-pill {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .status-pill .chip {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: var(--text) !important;
      font-size: 13px !important;
      text-align: left !important;
      justify-content: flex-start !important;
      font-weight: 500 !important;
      min-width: 0 !important;
      align-self: stretch !important;
      border-radius: 0 !important;
    }
    .status-pill .chip.ok {
      color: var(--text) !important;
    }
    .status-pill .chip.warn {
      color: #fb7c5e !important;
    }

    /* Pill toggle buttons */
    .pill-group {
      display: flex;
      border-radius: 10px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
    }
    .pill-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.02); color: var(--text); }
    .pill-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .pill-btn svg { flex: none; opacity: 0.65; }
    .pill-btn.active svg { opacity: 1; }

    /* Pipeline active-stage card */
    .pipeline-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      transition: border-color 220ms ease;
    }
    .pipeline-card[hidden] { display: none !important; }
    .pipeline-card.idle    { border-color: rgba(255,255,255,0.08); }
    .pipeline-card.running { border-color: rgba(255,193,7,0.3); }
    .pipeline-card.completed { border-color: rgba(76,175,80,0.3); }
    .pipeline-card.error   { border-color: rgba(244,67,54,0.3); }
    .pipeline-card.idle .pipeline-card-spin,
    .pipeline-card.completed .pipeline-card-spin,
    .pipeline-card.error .pipeline-card-spin {
      display: none;
    }
    .pipeline-card.completed .pipeline-card-status { color: #4CAF50; }
    .pipeline-card.error .pipeline-card-status { color: #f44336; }
    .pipeline-card.idle .pipeline-card-status { color: var(--muted); }
    .pipeline-card.completed .pipeline-fill { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
    .pipeline-card.error .pipeline-fill { background: linear-gradient(90deg, #f44336, #ef5350); }
    .pipeline-card.idle .pipeline-fill { background: rgba(255,255,255,0.12); }
    .pipeline-card-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .pipeline-card-spin {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: #FFC107;
      animation: pipeline-spin 0.8s linear infinite;
      flex: none;
    }
    .pipeline-card-stage {
      flex: 1;
      min-width: 0;
      font-weight: 700; font-size: 13px;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pipeline-card-status {
      font-size: 11px; font-weight: 700;
      color: #FFC107;
      white-space: nowrap;
    }
    .pipeline-card-time {
      font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pipeline-bar {
      width: 100%; height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .pipeline-fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #FFC107, #ffd76a);
      transition: width 220ms ease;
    }
    .pipeline-link {
      font-size: 12px; color: #FFC107;
      font-weight: 600; cursor: pointer;
      text-align: left;
    }
    .pipeline-link:hover { text-decoration: underline; }

    .lyrics-preview-scroll {
      max-height: 180px; overflow-y: auto; padding: 10px; margin: 8px 0;
      border-radius: 12px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font: 500 13px/1.6 var(--ui); direction: rtl; text-align: right;
      white-space: pre-wrap; color: var(--text);
    }
    .lyrics-preview-scroll:empty { display: none; }
    .lyrics-source-label { margin: 4px 0; }
    .lyrics-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.4;
      white-space: nowrap;
    }
    .lyrics-badge.ddg {
      background: rgba(255, 167, 38, 0.18);
      color: #FFA726;
    }
    .lyrics-badge.direct {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }
    .lyrics-badge.llm {
      background: rgba(171, 71, 188, 0.18);
      color: #CE93D8;
    }

    @media (max-width: 940px) {
      .shell { width: calc(100vw - 16px); margin: 8px auto; padding: 10px; }
      .app { flex-direction: column; gap: 16px; }
      .rail { flex: 0 0 auto; width: 100%; min-width: 0; }
      .workspace { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <aside class="rail" id="leftRail">
        <section class="section" style="display:flex;flex-direction:column;gap:14px;">
          <!-- Header -->
          <div class="rail-header">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path d="M9 15V9l3 3-3 3z"/>
              <path d="M13 15V9l3 3-3 3z"/>
            </svg>
            <h2>Waveform Karaoke</h2>
          </div>

          <!-- Project -->
          <div class="sidebar-section">
            <div class="sidebar-label">PROJECT</div>
            <div class="project-input-wrap">
              <input id="projectName" type="text" placeholder="Project name">
              <select id="projectSelect">
                <option value="">No saved projects</option>
              </select>
              <div class="project-input-arrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </div>
            </div>
            <button class="btn-primary" id="saveProject">Save Project</button>
            <div class="btn-row">
              <button class="btn-danger" id="deleteProject">Delete Project</button>
              <button class="btn-primary" id="exportMp4">Export</button>
            </div>
            <button class="btn-outline" id="showVideo" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              Show Movie
            </button>
          </div>

          <!-- Setup -->
          <div class="sidebar-section">
            <div class="pill-group" id="sourceToggle">
              <button class="pill-btn active" data-source="youtube">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M23.8 6.6c-.3-1.1-1.1-1.9-2.2-2.2C19.8 4 12 4 12 4s-7.8 0-9.6.4C1.3 4.7.5 5.5.2 6.6 0 8.1 0 12 0 12s0 3.9.2 5.4c.3 1.1 1.1 1.9 2.2 2.2 1.8.4 9.6.4 9.6.4s7.8 0 9.6-.4c1.1-.3 1.9-1.1 2.2-2.2.2-1.5.2-5.4.2-5.4s0-3.9-.2-5.4zM9.6 15.6V8.4l6.4 3.6-6.4 3.6z"/>
                </svg>
                YouTube
              </button>
              <button class="pill-btn" data-source="audio">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
                Audio File
              </button>
            </div>
            <div class="combined-input" id="setupInputArea">
              <svg class="icon-left" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
              <input class="url-input" id="youtubeUrl" type="url" dir="ltr" placeholder="Paste a YouTube link" style="padding-left:32px;">
              <input id="audioFile" type="file" accept="audio/*" hidden>
            </div>
            <button class="btn-primary" id="importProject" style="display:flex;align-items:center;justify-content:center;">
              Create Project
            </button>
          </div>

          <!-- Pipeline -->
          <div class="sidebar-section">
            <div class="pipeline-card" id="pipelineCard" hidden>
              <div class="pipeline-card-row">
                <div class="pipeline-card-spin"></div>
                <div class="pipeline-card-stage" id="pipelineStage">Initializing...</div>
                <div class="pipeline-card-status" id="pipelineStatusLabel">Running...</div>
                <div class="pipeline-card-time" id="pipelineElapsed">0:00</div>
              </div>
              <div class="pipeline-bar">
                <div class="pipeline-fill" id="pipelineProgressFill"></div>
              </div>
            </div>
            
          </div>

          <!-- AI -->
          <div class="sidebar-section">
            <button class="btn-primary" id="aiFirstPass" style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
              AI Pass
            </button>
            <button class="btn-danger btn-hidden" id="stopAiPass" style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
              </svg>
              Stop AI Pass
            </button>
          </div>

          <!-- Footer -->
           <div class="status-pill">
             <div class="chip" id="projectStatus">No project loaded.</div>
           </div>

        </section>
      </aside>

      <main class="workspace">
        <section class="section editor" style="position: relative;">
          <button class="panel-toggle left" id="toggleLeft" aria-label="Toggle Left Panel">◀</button>
          <button class="panel-toggle right" id="toggleRight" aria-label="Toggle Right Panel">▶</button>
          <input id="projectTitle" class="project-title-input" type="text" placeholder="Singer / Project Name">
          <div class="preview empty" id="preview">Import a project to begin.</div>
          <textarea id="lyricsText" hidden></textarea>
          <audio id="audio" controls preload="metadata"></audio>
          <audio id="vocalsAudio" preload="metadata"></audio>
          <audio id="musicAudio" preload="metadata"></audio>
<div class="toolbar">
              <div class="toolbar-left">
                <div class="time-readout" id="audioTime">0:00 / 0:00</div>
                <button class="secondary icon-button" id="rewindStart" aria-label="Go to Beginning">⏮</button>
                <button class="secondary icon-button" id="playPause" aria-label="Play or Pause">▶</button>
                <button class="secondary" id="back2">-2s</button>
                <button class="secondary" id="jumpWord">Sync</button>
                <button class="warn" id="placeWord">Commit</button>
                <button class="secondary" id="resetWord">Reset→</button>
                <div class="btn-group">
                  <button class="secondary" id="prevWord">Prev</button>
                  <button class="secondary" id="nextWord">Next</button>
                  <button class="secondary" id="lastWord">Last</button>
                </div>
              </div>
              <div class="toolbar-middle">
                <div class="chip selected" id="selectedWordLabel">Selected word: none</div>
              </div>
              <div class="toolbar-right">
                <div class="stem-mix">
                  <input id="stemMix" type="range" min="-1" max="1" step="0.01" value="0">
                </div>
                <button class="secondary" id="zoomOut" aria-label="Zoom Out">-</button>
                <button class="secondary" id="zoomIn" aria-label="Zoom In">+</button>
                <button class="secondary" id="zoomReset" aria-label="Reset Zoom">100</button>
              </div>
            </div>
          <div class="wave-shell" id="waveShell">
            <div class="word-layer" id="wordLayer"></div>
            <div class="playhead" id="playhead"></div>
            <canvas id="waveCanvas" width="1280" height="240"></canvas>
            <div class="pan">
              <input id="wavePan" type="range" min="0" max="0" step="0.01" value="0">
            </div>
          </div>
        </section>
        <aside class="drawer" id="rightDrawer" hidden>
          <div class="drawer-tabs">
            <div class="drawer-tab active" data-tab="editor">Lyrics Editor</div>
            <div class="drawer-tab" data-tab="import">Import Lyrics</div>
          </div>
          <button class="drawer-close" id="closeDrawer" aria-label="Close">✕</button>
          <div class="drawer-header">
            <div class="drawer-header-title">LYRICS ⓘ</div>
          </div>
          <div class="drawer-body">
            <div class="drawer-tab-content" id="tabEditor">
              <div class="drawer-content" id="lyricsList"></div>
            </div>
            <div class="drawer-tab-content" id="tabImport" hidden>
              <div class="drawer-section">
                <div class="drawer-section-title">Paste Lyrics</div>
                <textarea id="pasteLyrics" rows="4" placeholder="Paste raw lyrics here, then click Process..."></textarea>
                <button id="processLyrics" disabled>Process</button>
              </div>
              <div class="drawer-section">
                <div class="drawer-section-title">Find Lyrics Online</div>
                <button class="btn-primary" id="searchLyrics" disabled
                        style="display:flex;align-items:center;justify-content:center;gap:8px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  Find Lyrics Online
                </button>
                <div id="lyricsPreview" hidden>
                  <div style="display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap;">
                    <a id="lyricsSourceLink" target="_blank" class="field-link"

  <script>

      searchLyrics: $("searchLyrics"),
      lyricsPreview: $("lyricsPreview"),
      lyricsSourceLink: $("lyricsSourceLink"),
      lyricsSourceStatus: $("lyricsSourceStatus"),
      lyricsDiscoveryBadge: $("lyricsDiscoveryBadge"),
      lyricsExtractionBadge: $("lyricsExtractionBadge"),
      lyricsPreviewText: $("lyricsPreviewText"),
      useLyricsBtn: $("useLyricsBtn"),
      tryNextSourceBtn: $("tryNextSourceBtn"),
      lyricsFallback: $("lyricsFallback"),
      fallbackLink: $("fallbackLink"),
      toggleManualSearch: $("toggleManualSearch"),
      manualSearchPanel: $("manualSearchPanel"),
      manualSearchQuery: $("manualSearchQuery"),
      manualDdgBtn: $("manualDdgBtn"),
      manualSearchResults: $("manualSearchResults"),
      manualFetchUrlBtn: $("manualFetchUrlBtn"),
      manualLlmBtn: $("manualLlmBtn"),

      shortcutHint: $("shortcutHint"),
    };

    const state = {
      railOpen: true,
      session: null,
      projects: [],
      manifest: { lines: [], words: [] },
      overrides: { version: 1, global_offset: 0, placed_word_count: 0, lines: {}, words: {} },
      waveform: null,
      baseWords: [],
      resolvedWords: [],
      selectedWordIndex: 0,
      placedWordCount: 0,
      zoomSeconds: DEFAULT_ZOOM_SECONDS,
      displayWindow: { start: 0, end: DEFAULT_ZOOM_SECONDS },
      playheadDrag: null,
      wordDrag: null,
      durationDrag: null,
      redrawQueued: false,
      exportPoller: null,
      pipelinePoller: null,
      pipelineRunning: false,
      pipelineAwaitingProjectLoad: false,
      pipelineLoadingProject: false,
      exportLocalStartMs: null,
      outputVideoPath: null,
      outputVideoAvailable: false,
      exportRunning: false,
      lyricsTextDebounce: null,
      stemMixValue: 0,
      stemMixAvailable: false,
      drawerOpen: false,
      lastSaveTimeMs: null,
      hasUnsavedChanges: false,
      clickedLineIndex: -1,
      fetchResults: null,
      fetchResultIndex: -1,
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function hasProject() {
      return state.baseWords.length > 0 && !!state.waveform;
    }

    function formatClock(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(seconds, 0) : 0;
      const mins = Math.floor(safe / 60);
      const secs = Math.floor(safe % 60);
      const hundredths = Math.floor((safe - Math.floor(safe)) * 100);
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
    }

    function formatPlaybackTime(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(seconds, 0) : 0;
      const mins = Math.floor(safe / 60);
      const secs = Math.floor(safe % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function inferDirection(text) {
      return /[\u0590-\u05FF\u0600-\u06FF]/.test(text) ? "rtl" : "ltr";
    }

    function getAudioDuration() {
      if (Number.isFinite(ui.audio.duration) && ui.audio.duration > 0) {
        return ui.audio.duration;
      }
      if (state.waveform && Number.isFinite(state.waveform.duration)) {
        return state.waveform.duration;
      }
      const lastResolved = [...state.resolvedWords].reverse().find((word) => Number.isFinite(word.end));
      if (lastResolved) {
        return lastResolved.end;
      }
      const lastBase = state.baseWords[state.baseWords.length - 1];
      return lastBase ? lastBase.end : 0;
    }

    function clampUnit(value) {
      return clamp(value, -1, 1);
    }

    function applyStemMix() {
      const safe = clampUnit(state.stemMixValue);
      const deadZone = 0.08;
      const absSafe = Math.abs(safe);
      let masterGain = 0.0;
      let vocalsGain = 0.0;
      let musicGain = 0.0;
      if (absSafe <= deadZone) {
        masterGain = 1.0;
      } else if (safe < -deadZone) {
        vocalsGain = clamp((-safe - deadZone) / (1 - deadZone), 0, 1);
        masterGain = 1.0 - vocalsGain;
      } else {
        musicGain = clamp((safe - deadZone) / (1 - deadZone), 0, 1);
        masterGain = 1.0 - musicGain;
      }
      if (state.stemMixAvailable) {
        ui.audio.muted = false;
        ui.audio.volume = masterGain;
        ui.vocalsAudio.volume = vocalsGain;
        ui.musicAudio.volume = musicGain;
      } else {
        ui.audio.muted = false;
        ui.audio.volume = 1.0;
      }
    }

    function pauseStemPlayers() {
      ui.vocalsAudio.pause();
      ui.musicAudio.pause();
    }

    function syncStemPlayback(options = {}) {
      if (!state.stemMixAvailable) {
        return;
      }
      const force = Boolean(options.force);
      const targetTime = clamp(ui.audio.currentTime || 0, 0, getAudioDuration());
      [ui.vocalsAudio, ui.musicAudio].forEach((player) => {
        const current = Number.isFinite(player.currentTime) ? player.currentTime : 0;
        if (force || Math.abs(current - targetTime) > 0.08) {
          try {
            player.currentTime = targetTime;
          } catch (_) {
            // ignore media seek sync errors
          }
        }
        if (ui.audio.paused) {
          player.pause();
        } else if (player.paused) {
          player.play().catch(() => {});
        }
      });
    }

    function refreshStemAvailability() {
      const vocalsReady = ui.vocalsAudio.readyState >= 1;
      const musicReady = ui.musicAudio.readyState >= 1;
      state.stemMixAvailable = vocalsReady && musicReady;
      applyStemMix();
      renderButtons();
    }

    function setupStemPlaybackSources() {
      const seed = Date.now();
      ui.audio.src = `/api/audio?artifact=audio_wav&t=${seed}`;
      ui.vocalsAudio.src = `/api/audio?artifact=vocals_wav&t=${seed}`;
      ui.musicAudio.src = `/api/audio?artifact=no_vocals_wav&t=${seed}`;
      ui.audio.load();
      ui.vocalsAudio.load();
      ui.musicAudio.load();
      state.stemMixAvailable = false;
      applyStemMix();
      
      // Re-check availability once audio metadata loads
      const onReady = () => refreshStemAvailability();
      ui.vocalsAudio.addEventListener("loadedmetadata", onReady, { once: true });
      ui.musicAudio.addEventListener("loadedmetadata", onReady, { once: true });
    }

    function getWordDuration(baseWord) {
      const duration = baseWord.end - baseWord.start;
      return duration > 0.01 ? duration : 0.12;
    }

    function syncResolvedWords() {
      const overrides = state.overrides.words || {};
      const manifestWords = Array.isArray(state.manifest.words) ? state.manifest.words : [];
      const manifestLines = Array.isArray(state.manifest.lines) ? state.manifest.lines : [];

      // Create a set of word IDs that are the last words of any line
      const lineEndWordIds = new Set();
      manifestLines.forEach((line) => {
        if (Array.isArray(line.word_ids) && line.word_ids.length > 0) {
          lineEndWordIds.add(line.word_ids[line.word_ids.length - 1]);
        }
      });

      state.baseWords = [...manifestWords].sort((a, b) => a.index - b.index);
      state.placedWordCount = clamp(Number(state.overrides.placed_word_count || 0), 0, state.baseWords.length);

      // Pass 1: Resolve starts and base ends
      const words = state.baseWords.map((word, index) => {
        const override = overrides[word.id] || {};
        const duration = getWordDuration(word);
        const isCommitted = index < state.placedWordCount;
        const start = isCommitted
          ? (Number.isFinite(override.start) ? override.start : (Number.isFinite(word.start) ? word.start : 0))
          : null;
        let end = isCommitted
          ? (Number.isFinite(override.end) ? override.end : word.end)
          : null;
        const explicitEnd = isCommitted && Number.isFinite(override.explicit_end) ? override.explicit_end : undefined;

        return {
          ...word,
          duration,
          start,
          // Vocal end MUST be based on the natural duration to detect gaps correctly.
          vocalEnd: Number.isFinite(start) ? start + duration : null,
          isLineEnd: lineEndWordIds.has(word.id),
          _explicitEnd: explicitEnd,
        };
      });

      // Pass 2: Refine end times based on the "Chained Timing" and "2s Padding" rules
      state.resolvedWords = words.map((word, index) => {
        if (word.start === null) return word;

        const nextWord = words[index + 1];
        const isLastWord = index === words.length - 1;
        const isNextPlaced = nextWord && nextWord.start !== null;

        // Sentence group rule: adjacent words in the same line are strictly gapless
        if (isNextPlaced && nextWord.line_index === word.line_index) {
          return {
            ...word,
            end: Number(nextWord.start.toFixed(3)),
          };
        }

        if (word._explicitEnd !== undefined) {
           return { ...word, end: word._explicitEnd };
        }
        
        // Cap natural vocal duration at 2.0 seconds to prevent tails extending into silence
        const vocalEndCapped = word.start + Math.min(word.duration, 2.0);
        let finalEnd = vocalEndCapped;

        if (isLastWord) {
          // Rule: Last word of song gets 2.0s padding
          finalEnd = vocalEndCapped + 2.0;
        } else if (isNextPlaced) {
          const nextStart = nextWord.start;
          const gap = nextStart - vocalEndCapped;

          if (word.isLineEnd || gap > 2.0) {
            // Rule: End of line or large gap gets 2.0s padding
            finalEnd = Math.min(vocalEndCapped + 2.0, nextStart);
          } else {
            // Rule: Chained presentation
            finalEnd = nextStart;
          }
        } else {
          if (word.isLineEnd) {
            finalEnd = vocalEndCapped + 2.0;
          }
        }

        return {
          ...word,
          end: Number(finalEnd.toFixed(3)),
        };
      });

      if (!state.wordDrag) {
        const currentIndex = Math.min(state.placedWordCount, Math.max(state.resolvedWords.length - 1, 0));
        state.selectedWordIndex = clamp(currentIndex, 0, Math.max(state.resolvedWords.length - 1, 0));
      }
    }

    function getResolvedLines() {
      const wordById = new Map(state.resolvedWords.map((word) => [word.id, word]));
      const baseWordById = new Map(state.baseWords.map((word) => [word.id, word]));
      const manifestLines = Array.isArray(state.manifest.lines) ? state.manifest.lines : [];
      return manifestLines.map((line) => {
        const allWords = (line.word_ids || []).map((wordId) => baseWordById.get(wordId)).filter(Boolean);
        const words = (line.word_ids || [])
          .map((wordId) => wordById.get(wordId))
          .filter((word) => word && Number.isFinite(word.start) && Number.isFinite(word.end));
        if (!words.length) {
          return { ...line, allWords, words: [], start: line.start || 0, end: line.end || 0 };
        }
        return {
          ...line,
          allWords,
          words,
          start: words[0].start,
          end: words[words.length - 1].end,
        };
      });
    }

    function getSelectedWord() {
      return state.resolvedWords[state.selectedWordIndex] || null;
    }

    function updateStatusChip(element, text, mode) {
      element.textContent = text;
      element.className = "chip";
      if (mode) {
        element.classList.add(mode);
      }
    }

    function renderSelectedWordLabel(selectedWord) {
      const wordText = selectedWord ? selectedWord.text : "none";
      const selectedPosition = selectedWord ? selectedWord.index + 1 : 0;
      ui.selectedWordLabel.innerHTML = "";
      const wordSpan = document.createElement("span");
      wordSpan.className = "selected-word-text";
      wordSpan.textContent = wordText;
      const spacer = document.createTextNode(" ");
      const countSpan = document.createElement("span");
      countSpan.className = "selected-word-count";
      countSpan.textContent = `${selectedPosition}/${state.resolvedWords.length}`;
      ui.selectedWordLabel.append(wordSpan, spacer, countSpan);
    }

    function displayOutputName(rawPath) {
      if (!rawPath) {
        return "No output yet.";
      }
      const normalized = String(rawPath).split(/[\\/]/).filter(Boolean);
      return normalized.length ? normalized[normalized.length - 1] : String(rawPath);
    }

    function deriveLyricsTextFromManifest() {
      if (!Array.isArray(state.manifest.lines)) {
        return "";
      }
      const lines = state.manifest.lines
        .map((line) => (line && typeof line.text === "string" ? line.text.trim() : ""))
        .filter(Boolean);
      return lines.join("\n");
    }

    function splitLyricWords(text) {
      return String(text || "").trim().split(/\s+/).filter(Boolean);
    }

    function cleanLyricsLines(rawText) {
      return String(rawText || "")
        .split(/\r?\n/)
        .map((line) => line.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function getContentEditableCursorOffset(element) {
      const sel = window.getSelection();
      if (!sel.rangeCount || !element.contains(sel.anchorNode)) return null;
      const range = sel.getRangeAt(0);
      const pre = document.createRange();
      pre.selectNodeContents(element);
      pre.setEnd(range.startContainer, range.startOffset);
      return pre.toString().length;
    }

    function setContentEditableCursorOffset(element, offset) {
      if (offset == null) return;
      element.focus();
      const sel = window.getSelection();
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
      let current = 0;
      let node;
      while (node = walker.nextNode()) {
        const len = node.textContent.length;
        if (current + len >= offset) {
          const r = document.createRange();
          r.setStart(node, offset - current);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          return;
        }
        current += len;
      }
      const r = document.createRange();
      r.selectNodeContents(element);
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
    }

    function buildManifestFromLyricsText(lyricsText, durationSeconds) {
      const lines = cleanLyricsLines(lyricsText);
      const flattened = [];
      lines.forEach((line, lineIndex) => {
        splitLyricWords(line).forEach((token) => {
          flattened.push({ lineIndex, token });
        });
      });
      if (!flattened.length) {
        return { lines: [], words: [] };
      }
      
      const safeDuration = Number.isFinite(durationSeconds) && durationSeconds > 0 
        ? durationSeconds 
        : Math.max(flattened.length * 0.5, 10.0);
        
      const slotDuration = safeDuration / flattened.length;
      const words = [];
      const lineToWordIds = new Map(lines.map((_, index) => [index, []]));

      flattened.forEach((entry, index) => {        const id = `word_${String(index).padStart(4, "0")}`;
        lineToWordIds.get(entry.lineIndex).push(id);
        words.push({
          id,
          index,
          line_index: entry.lineIndex,
          text: entry.token,
          start: null, // No default timing to avoid "mounted" stacking
          end: null,
        });
      });

      const wordLookup = new Map(words.map((word) => [word.id, word]));
      const manifestLines = lines.map((line, index) => {
        const wordIds = lineToWordIds.get(index) || [];
        const start = wordIds.length ? Number(wordLookup.get(wordIds[0]).start) : 0;
        const end = wordIds.length ? Number(wordLookup.get(wordIds[wordIds.length - 1]).end) : 0.01;
        return {
          id: `line_${String(index).padStart(3, "0")}`,
          index,
          text: line,
          start,
          end,
          word_ids: wordIds,
        };
      });

      return { lines: manifestLines, words };
    }

    function updateLyricsSourceLink(url) {
      if (!ui.lyricsSourceLink) {
        return;
      }
      const safeUrl = String(url || "").trim() || LYRICS_SOURCE_DEFAULT_URL;
      ui.lyricsSourceLink.href = safeUrl;
      ui.lyricsSourceLink.textContent = safeUrl;
    }

    function updateSearchLyricsButton() {
      const title = (ui.projectTitle?.value || ui.projectName?.value || "").trim();
      if (ui.searchLyrics) {
        ui.searchLyrics.disabled = !title;
      }
    }

    function showLyricsResult(index) {
      const results = state.fetchResults;
      const total = results ? results.length : 0;

      if (!results || total === 0) {
        ui.lyricsPreviewText.textContent = "No lyrics sources available.";
        if (ui.lyricsSourceLink) { ui.lyricsSourceLink.style.display = "none"; }
        if (ui.lyricsSourceStatus) { ui.lyricsSourceStatus.style.display = "none"; }
        if (ui.lyricsDiscoveryBadge) { ui.lyricsDiscoveryBadge.style.display = "none"; }
        if (ui.lyricsExtractionBadge) { ui.lyricsExtractionBadge.style.display = "none"; }
        ui.useLyricsBtn.hidden = true;
        ui.tryNextSourceBtn.hidden = true;
        state.fetchResultIndex = index;
        return;
      }

      const safeIndex = ((index % total) + total) % total;
      const result = results[safeIndex];
      ui.lyricsPreviewText.textContent = result.lyrics_text || result.error || "No lyrics found.";

      if (result.success && result.source_url) {
        if (ui.lyricsSourceLink) {
          ui.lyricsSourceLink.href = result.source_url;
          ui.lyricsSourceLink.textContent = `Fetched from ${result.source}`;
          ui.lyricsSourceLink.style.display = "inline";
        }
        if (ui.lyricsSourceStatus) { ui.lyricsSourceStatus.style.display = "none"; }
      } else {
        if (ui.lyricsSourceLink) { ui.lyricsSourceLink.style.display = "none"; }
        if (ui.lyricsSourceStatus) {
          ui.lyricsSourceStatus.textContent = `${result.source}: ${result.error || "failed"}`;
          ui.lyricsSourceStatus.className = "chip warn";
          ui.lyricsSourceStatus.style.display = "inline";
        }
      }

      if (ui.lyricsDiscoveryBadge) {
        if (result.discovery_method === "ddg") {
          ui.lyricsDiscoveryBadge.textContent = "via DuckDuckGo";
          ui.lyricsDiscoveryBadge.className = "lyrics-badge ddg";
          ui.lyricsDiscoveryBadge.style.display = "inline-block";
        } else if (result.discovery_method === "direct") {
          ui.lyricsDiscoveryBadge.textContent = "direct search";
          ui.lyricsDiscoveryBadge.className = "lyrics-badge direct";
          ui.lyricsDiscoveryBadge.style.display = "inline-block";
        } else {
          ui.lyricsDiscoveryBadge.style.display = "none";
        }
      }

      if (ui.lyricsExtractionBadge) {
        if (result.extraction_method === "llm") {
          ui.lyricsExtractionBadge.textContent = "via local LLM";
          ui.lyricsExtractionBadge.className = "lyrics-badge llm";
          ui.lyricsExtractionBadge.style.display = "inline-block";
        } else {
          ui.lyricsExtractionBadge.style.display = "none";
        }
      }

      const nextIndex = (safeIndex + 1) % total;
      const nextSource = results[nextIndex].source;
      ui.useLyricsBtn.hidden = !result.success;
      ui.tryNextSourceBtn.hidden = false;
      ui.tryNextSourceBtn.textContent = `Try next: ${nextSource} →`;
      state.fetchResultIndex = safeIndex;
    }

    function applyLyricsTextLocally(rawLyricsText) {
      markUnsaved();
      const nextManifest = buildManifestFromLyricsText(rawLyricsText, getAudioDuration());
      const previousPlaced = state.placedWordCount;
      const oldCommitted = state.baseWords.slice(0, previousPlaced);
      
      const wordCountIdentical = (Array.isArray(state.baseWords) && state.baseWords.length > 0 && nextManifest.words.length === state.baseWords.length);
      
      let preservedCount = 0;
      if (wordCountIdentical) {
        preservedCount = previousPlaced;
      } else {
        while (
          preservedCount < oldCommitted.length
          && preservedCount < nextManifest.words.length
          && oldCommitted[preservedCount].text === nextManifest.words[preservedCount].text
        ) {
          preservedCount += 1;
        }
      }

      const preservedOverrides = {};
      for (let index = 0; index < preservedCount; index += 1) {
        const oldWord = state.resolvedWords[index];
        const newWord = nextManifest.words[index];
        if (!oldWord || !newWord) {
          continue;
        }
        if (wordCountIdentical || oldWord.text === newWord.text) {
          if (Number.isFinite(oldWord.start) && Number.isFinite(oldWord.end)) {
            preservedOverrides[newWord.id] = {
              start: Number(oldWord.start.toFixed(3)),
              end: Number(oldWord.end.toFixed(3)),
              ...(oldWord._explicitEnd !== undefined && { explicit_end: Number(oldWord._explicitEnd.toFixed(3)) })
            };
          }
        }
      }

      state.manifest = nextManifest;
      state.overrides.words = preservedOverrides;
      state.overrides.lines = {};
      state.overrides.placed_word_count = preservedCount;
      state.overrides.lyrics_text = cleanLyricsLines(rawLyricsText).join("\n");
      state.placedWordCount = preservedCount;
      if (state.session) {
        state.session.lyrics_text = state.overrides.lyrics_text;
      }
      ui.lyricsText.value = state.overrides.lyrics_text;
      syncResolvedWords();
      renderAll();
      if (state.waveform) {
        updateStatusChip(ui.projectStatus, `Ready: ${state.resolvedWords.length} words`, state.resolvedWords.length ? "ok" : undefined);
      }
    }

    function scheduleLyricsTextRebuild() {
      if (state.lyricsTextDebounce) {
        clearTimeout(state.lyricsTextDebounce);
      }
      state.lyricsTextDebounce = setTimeout(() => {
        state.lyricsTextDebounce = null;
        applyLyricsTextLocally(ui.lyricsText.value);
      }, LYRICS_TEXT_DEBOUNCE_MS);
    }

    function estimatedExportProgress(payload) {
      const rawProgress = Number(payload?.progress);
      const reportedProgress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(rawProgress, 100)) : 0;
      if (!["queued", "building_subtitles", "rendering"].includes(payload?.status)) {
        return reportedProgress;
      }

      const parsedStartedAt = payload?.started_at ? Date.parse(payload.started_at) : NaN;
      const startedMs = Number.isFinite(parsedStartedAt) ? parsedStartedAt : state.exportLocalStartMs;
      const estimatedTotalSeconds = Number(payload?.estimated_total_seconds);
      if (!startedMs || !Number.isFinite(estimatedTotalSeconds) || estimatedTotalSeconds <= 0) {
        return reportedProgress;
      }

      const elapsedSeconds = Math.max((Date.now() - startedMs) / 1000, 0);
      const estimatedProgress = Math.min(Math.max(15 + (elapsedSeconds / estimatedTotalSeconds) * 75, 0), 90);
      return Math.max(reportedProgress, Math.round(estimatedProgress));
    }

    function renderExportStatus(payload) {
      const status = payload?.status || "idle";
      const progress = estimatedExportProgress(payload);

      if (status === "idle") {
        state.exportRunning = false;
        state.outputVideoPath = null;
        state.exportLocalStartMs = null;
        renderShowVideoButton();
        renderPipelineStatus({ status: "idle", stages: [] });
        return;
      }

      if (["queued", "building_subtitles", "rendering"].includes(status)) {
        state.exportRunning = true;
        state.outputVideoPath = payload?.output_video || null;
        if (state.outputVideoPath) {
          state.outputVideoAvailable = true;
        }
        renderShowVideoButton();
        const elapsedText = state.exportLocalStartMs
          ? formatPlaybackTime(Math.max((Date.now() - state.exportLocalStartMs) / 1000, 0))
          : "";
        renderPipelineStatus({
          status: "running",
          stage_label: "Rendering MP4",
          status_label: `Rendering... ${progress}%`,
          progress: progress,
          elapsed_text: elapsedText,
        });
        return;
      }

      if (status === "done" || status === "completed") {
        state.exportRunning = false;
        state.outputVideoPath = payload?.output_video || null;
        if (state.outputVideoPath) {
          state.outputVideoAvailable = true;
        }
        renderShowVideoButton();
        renderPipelineStatus({
          status: "completed",
          stage_label: "Export complete",
          status_label: "\u2713",
          progress: 100,
        });
        return;
      }

      state.exportRunning = false;
      state.outputVideoPath = payload?.output_video || null;
      if (state.outputVideoPath) {
        state.outputVideoAvailable = true;
      }
      renderShowVideoButton();
      renderPipelineStatus({
        status: "error",
        stage_label: "Export failed",
        status_label: "\u2715",
        error: payload?.error || "Export failed",
        progress: progress,
      });
    }

    async function syncExportStatus() {
      const payload = await fetchJson("/api/export/status");
      if (payload?.started_at) {

    function stopExportPolling() {

      }
    }

    function startExportPolling() {
      stopExportPolling();
      state.exportPoller = setInterval(async () => {
        try {
