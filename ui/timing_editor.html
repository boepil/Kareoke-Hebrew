<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Karaoke Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f3ecdf;
      --muted: #92a0b6;
      --accent: #e4b21d;
      --warn: #ff8f78;
      --line: rgba(255, 255, 255, 0.08);
      --r: 24px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --ui: "Aptos", "Segoe UI", sans-serif;
      --display: "Aptos Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font: 14px/1.45 var(--ui);
      background:
        radial-gradient(1200px 700px at 0% 0%, rgba(228, 178, 29, 0.12), transparent 54%),
        radial-gradient(900px 700px at 100% 0%, rgba(71, 119, 190, 0.10), transparent 48%),
        linear-gradient(180deg, #10151f 0%, #090c11 60%, #07090d 100%);
    }

    button, input, textarea, select { font: inherit; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 2px 14px;
      background: var(--accent);
      color: #241906;
      font-weight: 800;
      line-height: 1.45;
      cursor: pointer;
      min-width: 52px;
      text-align: center;
      direction: inherit;
      unicode-bidi: isolate;
    }
    button.secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    #zoomOut, #zoomIn, #zoomReset { padding: 3px 8px; font-size: 11px; min-width: 36px; }
    button.warn { background: var(--warn); color: #2b0d08; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); min-width: 52px; text-align: center; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    input, textarea, select {
      width: 100%;
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }
    .url-input {
      direction: ltr;
      unicode-bidi: plaintext;
      text-align: left;
    }
    textarea { min-height: 300px; resize: vertical; }

    .shell {
      width: min(1540px, calc(100vw - 28px));
      margin: 14px auto;
      padding: 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: var(--shadow);
    }
    .app {
      display: flex;
      gap: 20px;
      min-height: calc(100vh - 56px);
      align-items: start;
    }
    .rail {
      flex: 0 0 292px;
      width: 292px;
      min-width: 292px;
      z-index: 2;
      overflow: hidden;
    }
    .workspace {
      flex: 1;
      min-width: 0;
      z-index: 1;
      overflow: hidden;
    }
    .rail > *, .workspace > * { min-width: 0; }
    .section {
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      padding: 16px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 11px;
      font-weight: 800;
    }
    h1, h2, p { margin: 0; }
    h1 { font: 700 clamp(22px, 2.1vw, 30px) / 1.02 var(--display); letter-spacing: -0.03em; }
    h2 { font: 700 22px / 1.05 var(--display); letter-spacing: -0.02em; }
    .muted { color: var(--muted); }
    .stack, .actions { display: grid; gap: 12px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
    .toolbar-left, .toolbar-right { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
    .toolbar-middle {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 80px;
      padding: 0 8px;
      overflow: hidden;
    }
    .toolbar-middle .chip {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: rtl;
      unicode-bidi: isolate;
    }
    .toolbar.split { justify-content: space-between; align-items: center; }
    .toolbar-group { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; }
    .stem-mix {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      min-width: 150px;
    }
    .stem-mix input[type="range"] {
      width: 132px;
      accent-color: var(--accent);
      padding: 0;
      background: transparent;
      border: 0;
    }
    .field { display: grid; gap: 7px; }
    .title-block { display: grid; gap: 6px; margin-bottom: 10px; }
    .title-block h1 { white-space: nowrap; }
    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .field-link {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .field-link:hover {
      color: var(--accent);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 12px;
      min-width: 52px;
      text-align: center;
      justify-content: center;
    }
    .chip.ok { color: #d6f5d2; background: rgba(143, 208, 143, 0.16); }
    .chip.warn { color: #ffd1c5; background: rgba(255, 143, 120, 0.14); }
    .chip.selected {
      background: rgba(228, 178, 29, 0.14);
      border: 1px solid rgba(228, 178, 29, 0.2);
      font-weight: 700;
    }
    .chip.selected .selected-word-text { color: var(--accent); }
    .chip.selected .selected-word-count {
      color: var(--text);
      margin-inline-start: 1.1em;
    }

    .stage, .editor { display: grid; gap: 14px; }
    .preview {
      min-height: 280px;
      height: 280px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.05);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));
      padding: 18px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      contain: layout paint;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .preview.empty {
      align-items: center;
      direction: ltr;
      font: 500 17px/1.4 var(--ui);
      color: rgba(255,255,255,0.45);
    }
    .preview-scroll {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      transform: translateY(-50%);
    }
    .preview-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.24em;
      min-height: 1.2em;
      width: 100%;
      font: 700 clamp(30px, 3.4vw, 50px) / 1.14 var(--display);
      letter-spacing: -0.03em;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0;
      transform: scale(0.95);
    }
    .preview-line.past {
      opacity: 0;
      transform: translateY(-30px) scale(0.9);
      pointer-events: none;
    }
    .preview-line.current {
      opacity: 1;
      transform: scale(1);
    }
    .preview-line.upcoming {
      opacity: 0.34;
      font-size: clamp(24px, 2.6vw, 38px);
      transform: scale(1);
    }
    .preview-line.standby {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }
    .preview-word { opacity: 0.34; transition: opacity 120ms ease, color 120ms ease, transform 120ms ease; }
    .preview-word.hidden { visibility: hidden; opacity: 0; }
    .preview-word.done { color: rgba(243, 236, 223, 0.95); opacity: 1; }
    .preview-word.current {
      color: var(--accent);
      opacity: 1;
      transform: translateY(-1px);
      text-shadow: 0 0 18px rgba(228, 178, 29, 0.3);
    }

    .editor-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .project-title-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: 700 26px/1.1 var(--display);
      text-align: center;
      letter-spacing: -0.02em;
    }
    .project-title-input::placeholder {
      color: rgba(255,255,255,0.36);
    }
    .time-readout {
      display: inline-flex;
      align-items: center;
      min-width: 88px;
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .icon-button {
      min-width: 30px;
      padding-inline: 8px;
      font-size: 18px;
      line-height: 1;
    }
    .wave-shell {
      position: relative;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(8, 11, 17, 0.9);
      padding: 18px 16px 14px;
      overflow: hidden;
    }
    .word-layer {
      position: relative;
      height: 94px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .word {
      position: absolute;
      top: 18px;
      transform: none;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(214, 220, 230, 0.76);
      white-space: nowrap;
      cursor: default;
      user-select: none;
      direction: auto;
      text-align: right;
      font: 700 20px/1 var(--display);
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
    }
    .word.draggable {
      cursor: ew-resize;
    }
    .word.alt { top: 48px; }
    .word.active {
      color: var(--accent);
      text-shadow: 0 0 18px rgba(228, 178, 29, 0.35);
    }
    .word.active.draft {
      color: var(--warn);
      text-shadow: 0 0 18px rgba(255, 143, 120, 0.42);
    }
    .word.active.done { color: var(--accent); }
    .word.done { color: rgba(214, 220, 230, 0.84); }
    .word.dragging,
    .word.dragging.done,
    .word.active.dragging,
    .word.active.dragging.done {
      color: var(--warn);
      text-shadow: 0 0 18px rgba(255, 143, 120, 0.42);
      z-index: 2;
    }

    canvas {
      width: 100%;
      display: block;
      height: 240px;
      background: #090c12;
      border-radius: 16px;
      margin-top: 14px;
    }
    .playhead {
      position: absolute;
      top: 18px;
      bottom: 14px;
      width: 2px;
      left: 50%;
      background: var(--warn);
      pointer-events: auto;
      z-index: 3;
      cursor: ew-resize;
    }
    .playhead::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 2px;
      background: var(--warn);
    }
    .small { font-size: 12px; color: var(--muted); }
    .pan { margin-top: 12px; }
    .pan input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      padding: 0;
      background: transparent;
      border: 0;
    }
    .export-status {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .export-status[hidden] {
      display: none;
    }
    .pipeline-status {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.025);
    }
    .pipeline-stages {
      display: grid;
      gap: 8px;
    }
    .pipeline-stage {
      display: grid;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.03);
    }
    .pipeline-stage-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .pipeline-stage-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }
    .pipeline-stage-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pipeline-stage-status {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pipeline-stage-status.running {
      color: #ffd8b6;
      background: rgba(255, 143, 120, 0.14);
    }
    .pipeline-stage-status.done,
    .pipeline-stage-status.skipped {
      color: #d6f5d2;
      background: rgba(143, 208, 143, 0.16);
    }
    .pipeline-stage-status.pending {
      color: var(--muted);
    }
    .pipeline-stage-status.error {
      color: #ffd1c5;
      background: rgba(255, 143, 120, 0.18);
    }
    .pipeline-stage-bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .pipeline-stage-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(228, 178, 29, 0.65), rgba(255, 143, 120, 0.9));
      transition: width 160ms ease;
    }
    .pipeline-stage-fill.running {
      background-size: 200% 100%;
      background-image: linear-gradient(90deg, rgba(255, 143, 120, 0.55), rgba(228, 178, 29, 0.95), rgba(255, 143, 120, 0.55));
      animation: pipeline-shift 1.2s linear infinite;
    }
    .pipeline-stage-fill.done,
    .pipeline-stage-fill.skipped,
    .pipeline-stage-fill.error {
      width: 100%;
    }
    .pipeline-spin {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: var(--accent);
      animation: pipeline-spin 0.8s linear infinite;
      flex: none;
    }
    .pipeline-stage.done .pipeline-spin,
    .pipeline-stage.skipped .pipeline-spin,
    .pipeline-stage.pending .pipeline-spin,
    .pipeline-stage.error .pipeline-spin {
      animation: none;
      border-top-color: transparent;
      opacity: 0.35;
    }
    @keyframes pipeline-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pipeline-shift {
      from { background-position: 0 0; }
      to { background-position: 200% 0; }
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #e4b21d 0%, #ffd76a 100%);
      transition: width 220ms ease;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .path-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .rail-divider {
      height: 1px;
      margin: 2px 0 4px;
      background: var(--line);
    }
    .path-value {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }
    audio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 940px) {
      .shell { width: calc(100vw - 16px); margin: 8px auto; padding: 10px; }
      .app { flex-direction: column; gap: 16px; }
      .rail { flex: 0 0 auto; width: 100%; min-width: 0; }
      .workspace { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app">
      <aside class="rail">
        <section class="section">
          <div class="title-block">
            <h1>Waveform Karaoke</h1>
          </div>
          <div class="stack">
            <div class="field">
              <label for="projectSelect">Saved Projects</label>
              <select id="projectSelect">
                <option value="">No saved projects</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button id="saveProject">Save Project</button>
            <button class="warn" id="deleteProject">Delete Project</button>
            <button id="exportMp4">Export MP4</button>
            <button class="ghost" id="resetAll">Reset All</button>
          </div>
          <div class="export-status" id="exportStatus" hidden>
            <div class="progress-meta">
              <span id="exportStage">Idle</span>
              <span id="exportPercent">0%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="exportProgressFill"></div></div>
            <div class="small" id="exportDetail">No export running.</div>
          </div>
          <div class="pipeline-status" id="pipelineStatus">
            <div class="progress-meta">
              <span id="pipelineStage">Pipeline idle</span>
              <span id="pipelineElapsed">0:00</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="pipelineProgressFill"></div></div>
            <div class="small" id="pipelineDetail">No pipeline running.</div>
            <div class="pipeline-stages" id="pipelineStages"></div>
          </div>
          <div class="path-card">
            <div class="chip" id="projectStatus">No project loaded.</div>
            <div class="path-value" id="pathsStatus">No output yet.</div>
          </div>
          <div class="rail-divider"></div>
          <div class="stack">
            <div class="field">
              <label for="youtubeUrl">YouTube URL</label>
              <input class="url-input" id="youtubeUrl" type="url" dir="ltr" placeholder="Paste a YouTube link">
              <button id="importProject">Create Project</button>
            </div>
            <div class="field">
              <label for="audioFile">Audio File</label>
              <input id="audioFile" type="file" accept="audio/*">
            </div>
            <div class="field">
              <label for="lyricsSourceLink">Lyrics Source</label>
        <a class="field-link" id="lyricsSourceLink" href="https://shirrim.com/singers/israel-singers/" target="_blank" rel="noopener noreferrer">https://shirrim.com/singers/israel-singers/</a>
            </div>
            <button id="aiFirstPass">AI Pass</button>
            <button id="stopAiPass" class="warn" hidden>Stop AI Pass</button>
            <div class="field">
              <label for="lyricsText">Lyrics Text</label>
              <textarea id="lyricsText" placeholder="Paste the whole song lyrics here."></textarea>
            </div>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <section class="section editor">
          <input id="projectName" class="project-title-input" type="text" placeholder="Project name">
          <div class="preview empty" id="preview">Import a project to begin.</div>
          <audio id="audio" controls preload="metadata"></audio>
          <audio id="vocalsAudio" preload="metadata"></audio>
          <audio id="musicAudio" preload="metadata"></audio>
<div class="toolbar">
              <div class="toolbar-left">
                <div class="time-readout" id="audioTime">0:00 / 0:00</div>
                <button class="secondary icon-button" id="rewindStart" aria-label="Go to Beginning">⏮</button>
                <button class="secondary icon-button" id="playPause" aria-label="Play or Pause">▶</button>
                <button class="secondary" id="back2">-2s</button>
                <button class="secondary" id="jumpWord">Sync</button>
                <button class="warn" id="placeWord">Commit</button>
                <button class="secondary" id="resetWord">Reset→</button>
                <button class="secondary" id="prevWord">Prev</button>
                <button class="secondary" id="nextWord">Next</button>
              </div>
              <div class="toolbar-middle">
                <div class="chip selected" id="selectedWordLabel">Selected word: none</div>
              </div>
              <div class="toolbar-right">
                <button class="secondary" id="lastWord">Last</button>
                <div class="stem-mix">
                  <input id="stemMix" type="range" min="-1" max="1" step="0.01" value="0">
                </div>
                <button class="secondary" id="zoomOut" aria-label="Zoom Out">-</button>
                <button class="secondary" id="zoomIn" aria-label="Zoom In">+</button>
                <button class="secondary" id="zoomReset" aria-label="Reset Zoom">100</button>
              </div>
            </div>
          <div class="wave-shell" id="waveShell">
            <div class="word-layer" id="wordLayer"></div>
            <div class="playhead" id="playhead"></div>
            <canvas id="waveCanvas" width="1280" height="240"></canvas>
            <div class="pan">
              <input id="wavePan" type="range" min="0" max="0" step="0.01" value="0">
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const DEFAULT_ZOOM_SECONDS = 18;
    const MIN_ZOOM_SECONDS = 0.35;
    const MIN_WORD_ORDER_GAP = 0.001;
    const PLAYHEAD_DRAG_SENSITIVITY = 0.2;
    const LYRICS_SOURCE_DEFAULT_URL = "https://shirrim.com/singers/israel-singers/";
    const LYRICS_TEXT_DEBOUNCE_MS = 250;

    const $ = (id) => document.getElementById(id);

    const ui = {
      youtubeUrl: $("youtubeUrl"),
      lyricsSourceLink: $("lyricsSourceLink"),
      audioFile: $("audioFile"),
      lyricsText: $("lyricsText"),
      projectName: $("projectName"),
      projectSelect: $("projectSelect"),
      importProject: $("importProject"),
      aiFirstPass: $("aiFirstPass"),
      stopAiPass: $("stopAiPass"),
      saveProject: $("saveProject"),
      deleteProject: $("deleteProject"),
      projectStatus: $("projectStatus"),
      pathsStatus: $("pathsStatus"),

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function hasProject() {
      return state.baseWords.length > 0 && !!state.waveform;
    }

    function formatClock(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(seconds, 0) : 0;
      const mins = Math.floor(safe / 60);
      const secs = Math.floor(safe % 60);
      const hundredths = Math.floor((safe - Math.floor(safe)) * 100);
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
    }

    function formatPlaybackTime(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(seconds, 0) : 0;
      const mins = Math.floor(safe / 60);
      const secs = Math.floor(safe % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function inferDirection(text) {
      return /[\u0590-\u05FF\u0600-\u06FF]/.test(text) ? "rtl" : "ltr";
    }

    function getAudioDuration() {
      if (Number.isFinite(ui.audio.duration) && ui.audio.duration > 0) {
        return ui.audio.duration;
      }
      if (state.waveform && Number.isFinite(state.waveform.duration)) {
        return state.waveform.duration;
      }
      const lastResolved = [...state.resolvedWords].reverse().find((word) => Number.isFinite(word.end));
      if (lastResolved) {
        return lastResolved.end;
      }
      const lastBase = state.baseWords[state.baseWords.length - 1];
      return lastBase ? lastBase.end : 0;
    }

    function clampUnit(value) {
      return clamp(value, -1, 1);
    }

    function applyStemMix() {
      const safe = clampUnit(state.stemMixValue);
      const deadZone = 0.08;
      const absSafe = Math.abs(safe);
      let masterGain = 0.0;
      let vocalsGain = 0.0;
      let musicGain = 0.0;
      if (absSafe <= deadZone) {
        masterGain = 1.0;
      } else if (safe < -deadZone) {
        vocalsGain = clamp((-safe - deadZone) / (1 - deadZone), 0, 1);
        masterGain = 1.0 - vocalsGain;
      } else {
        musicGain = clamp((safe - deadZone) / (1 - deadZone), 0, 1);
        masterGain = 1.0 - musicGain;
      }
      if (state.stemMixAvailable) {
        ui.audio.muted = false;
        ui.audio.volume = masterGain;
        ui.vocalsAudio.volume = vocalsGain;
        ui.musicAudio.volume = musicGain;
      } else {
        ui.audio.muted = false;
        ui.audio.volume = 1.0;
      }
    }

    function pauseStemPlayers() {
      ui.vocalsAudio.pause();
      ui.musicAudio.pause();

    function syncStemPlayback(options = {}) {
      if (!state.stemMixAvailable) {
        return;
      }
      const force = Boolean(options.force);
      const targetTime = clamp(ui.audio.currentTime || 0, 0, getAudioDuration());
      [ui.vocalsAudio, ui.musicAudio].forEach((player) => {
        const current = Number.isFinite(player.currentTime) ? player.currentTime : 0;
        if (force || Math.abs(current - targetTime) > 0.08) {
          try {
            player.currentTime = targetTime;
          } catch (_) {
            // ignore media seek sync errors
          }
        }
        if (ui.audio.paused) {
          player.pause();
        } else if (player.paused) {
          player.play().catch(() => {});
        }
      });
    }

    function refreshStemAvailability() {
      const vocalsReady = ui.vocalsAudio.readyState >= 1;
      const musicReady = ui.musicAudio.readyState >= 1;
      state.stemMixAvailable = vocalsReady && musicReady;
      applyStemMix();

    function setupStemPlaybackSources() {
      const seed = Date.now();
      ui.audio.src = `/api/audio?artifact=audio_wav&t=${seed}`;

      ui.audio.load();

      state.stemMixAvailable = false;
      applyStemMix();
      
      // Re-check availability once audio metadata loads
      const onReady = () => refreshStemAvailability();
      ui.vocalsAudio.addEventListener("loadedmetadata", onReady, { once: true });
      ui.musicAudio.addEventListener("loadedmetadata", onReady, { once: true });
    }

    function getWordDuration(baseWord) {
      const duration = baseWord.end - baseWord.start;
      return duration > 0.01 ? duration : 0.12;
    }

    function syncResolvedWords() {
      const overrides = state.overrides.words || {};
      const manifestWords = Array.isArray(state.manifest.words) ? state.manifest.words : [];
      const manifestLines = Array.isArray(state.manifest.lines) ? state.manifest.lines : [];

      // Create a set of word IDs that are the last words of any line
      const lineEndWordIds = new Set();
      manifestLines.forEach((line) => {
        if (Array.isArray(line.word_ids) && line.word_ids.length > 0) {
          lineEndWordIds.add(line.word_ids[line.word_ids.length - 1]);
        }
      });

      state.baseWords = [...manifestWords].sort((a, b) => a.index - b.index);
      state.placedWordCount = clamp(Number(state.overrides.placed_word_count || 0), 0, state.baseWords.length);

      // Pass 1: Resolve starts and base ends
      const words = state.baseWords.map((word, index) => {
        const override = overrides[word.id] || {};
        const duration = getWordDuration(word);
        const isCommitted = index < state.placedWordCount;
        const start = isCommitted
          ? (Number.isFinite(override.start) ? override.start : (Number.isFinite(word.start) ? word.start : 0))
          : null;
        let end = isCommitted
          ? (Number.isFinite(override.end) ? override.end : word.end)
          : null;

        return {
          ...word,
          duration,
          start,
          // Vocal end MUST be based on the natural duration to detect gaps correctly.
          // Using override.end here would cause circular logic since override.end 
          // might already be 'chained' to the next word.
          vocalEnd: Number.isFinite(start) ? start + duration : null,
          isLineEnd: lineEndWordIds.has(word.id),
        };
      });

      // Pass 2: Refine end times based on the "Chained Timing" and "2s Padding" rules
      state.resolvedWords = words.map((word, index) => {
        if (word.start === null) return word;

        const nextWord = words[index + 1];
        const isLastWord = index === words.length - 1;
        const isNextPlaced = nextWord && nextWord.start !== null;
        
        // Cap natural vocal duration at 2.0 seconds to prevent tails extending into silence
        const vocalEndCapped = word.start + Math.min(word.duration, 2.0);
        let finalEnd = vocalEndCapped;

        if (isLastWord) {
          // Rule: Last word of song gets 2.0s padding
          finalEnd = vocalEndCapped + 2.0;
        } else if (isNextPlaced) {
          const nextStart = nextWord.start;
          const gap = nextStart - vocalEndCapped;

          if (word.isLineEnd || gap > 2.0) {
            // Rule: End of line or large gap gets 2.0s padding
            finalEnd = Math.min(vocalEndCapped + 2.0, nextStart);
          } else {
            // Rule: Chained presentation
            finalEnd = nextStart;
          }
        } else {
          if (word.isLineEnd) {
            finalEnd = vocalEndCapped + 2.0;
          }
        }

        return {
          ...word,
          end: Number(finalEnd.toFixed(3)),
        };
      });

      const currentIndex = Math.min(state.placedWordCount, Math.max(state.resolvedWords.length - 1, 0));
      state.selectedWordIndex = clamp(currentIndex, 0, Math.max(state.resolvedWords.length - 1, 0));
    }

    function getResolvedLines() {
      const wordById = new Map(state.resolvedWords.map((word) => [word.id, word]));
      const baseWordById = new Map(state.baseWords.map((word) => [word.id, word]));
      const manifestLines = Array.isArray(state.manifest.lines) ? state.manifest.lines : [];
      return manifestLines.map((line) => {
        const allWords = (line.word_ids || []).map((wordId) => baseWordById.get(wordId)).filter(Boolean);
        const words = (line.word_ids || [])
          .map((wordId) => wordById.get(wordId))
          .filter((word) => word && Number.isFinite(word.start) && Number.isFinite(word.end));
        if (!words.length) {
          return { ...line, allWords, words: [], start: line.start || 0, end: line.end || 0 };
        }
        return {
          ...line,
          allWords,
          words,
          start: words[0].start,
          end: words[words.length - 1].end,
        };
      });
    }

    function deriveLyricsTextFromManifest() {
      if (!Array.isArray(state.manifest.lines)) {

    function cleanLyricsLines(rawText) {
      return String(rawText || "")

        .map((line) => line.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function buildManifestFromLyricsText(lyricsText, durationSeconds) {
      const lines = cleanLyricsLines(lyricsText);
      const flattened = [];
      lines.forEach((line, lineIndex) => {
        splitLyricWords(line).forEach((token) => {
          flattened.push({ lineIndex, token });
        });
      });
      if (!flattened.length) {
        return { lines: [], words: [] };
      }
      
      const safeDuration = Number.isFinite(durationSeconds) && durationSeconds > 0 
        ? durationSeconds 
        : Math.max(flattened.length * 0.5, 10.0);
        
      const slotDuration = safeDuration / flattened.length;
      const words = [];
      const lineToWordIds = new Map(lines.map((_, index) => [index, []]));

        lineToWordIds.get(entry.lineIndex).push(id);
        words.push({
          id,
          index,
          line_index: entry.lineIndex,
          text: entry.token,
          start: null, // No default timing to avoid "mounted" stacking
          end: null,
        });
      });

      const wordLookup = new Map(words.map((word) => [word.id, word]));
      const manifestLines = lines.map((line, index) => {
        const wordIds = lineToWordIds.get(index) || [];
        const start = wordIds.length ? Number(wordLookup.get(wordIds[0]).start) : 0;
        const end = wordIds.length ? Number(wordLookup.get(wordIds[wordIds.length - 1]).end) : 0.01;
        return {
          id: `line_${String(index).padStart(3, "0")}`,
          index,
          text: line,
          start,
          end,
          word_ids: wordIds,
        };
      });

      return { lines: manifestLines, words };
    }

    function updateLyricsSourceLink(url) {
      if (!ui.lyricsSourceLink) {
        return;
      }
      const safeUrl = String(url || "").trim() || LYRICS_SOURCE_DEFAULT_URL;
      ui.lyricsSourceLink.href = safeUrl;
      ui.lyricsSourceLink.textContent = safeUrl;
    }

    function applyLyricsTextLocally(rawLyricsText) {
      const nextManifest = buildManifestFromLyricsText(rawLyricsText, getAudioDuration());
      const previousPlaced = state.placedWordCount;
      const oldCommitted = state.baseWords.slice(0, previousPlaced);
      let preservedCount = 0;
      while (
        preservedCount < oldCommitted.length
        && preservedCount < nextManifest.words.length
        && oldCommitted[preservedCount].text === nextManifest.words[preservedCount].text
      ) {
        preservedCount += 1;
      }

      const preservedOverrides = {};
      for (let index = 0; index < preservedCount; index += 1) {
        const oldWord = state.resolvedWords[index];
        const newWord = nextManifest.words[index];
        if (!oldWord || !newWord || !Number.isFinite(oldWord.start) || !Number.isFinite(oldWord.end)) {
          continue;
        }
        preservedOverrides[newWord.id] = {
          start: Number(oldWord.start.toFixed(3)),
          end: Number(oldWord.end.toFixed(3)),
        };
      }

      state.manifest = nextManifest;
      state.overrides.words = preservedOverrides;
      state.overrides.lines = {};
      state.overrides.placed_word_count = preservedCount;
      state.overrides.lyrics_text = cleanLyricsLines(rawLyricsText).join("\n");
      state.placedWordCount = preservedCount;
      if (state.session) {
        state.session.lyrics_text = state.overrides.lyrics_text;
      }
      syncResolvedWords();
      renderAll();
      if (state.waveform) {
        updateStatusChip(ui.projectStatus, `Ready: ${state.resolvedWords.length} words`, state.resolvedWords.length ? "ok" : undefined);
      }
    }

    function estimatedExportProgress(payload) {
      const rawProgress = Number(payload?.progress);
      const reportedProgress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(rawProgress, 100)) : 0;
      if (!["queued", "building_subtitles", "rendering"].includes(payload?.status)) {
        return reportedProgress;
      }

      const parsedStartedAt = payload?.started_at ? Date.parse(payload.started_at) : NaN;
      const startedMs = Number.isFinite(parsedStartedAt) ? parsedStartedAt : state.exportLocalStartMs;
      const estimatedTotalSeconds = Number(payload?.estimated_total_seconds);
      if (!startedMs || !Number.isFinite(estimatedTotalSeconds) || estimatedTotalSeconds <= 0) {
        return reportedProgress;
      }

      const elapsedSeconds = Math.max((Date.now() - startedMs) / 1000, 0);
      const estimatedProgress = Math.min(Math.max(15 + (elapsedSeconds / estimatedTotalSeconds) * 75, 0), 90);
      return Math.max(reportedProgress, Math.round(estimatedProgress));
    }

    function renderExportStatus(payload) {
      const status = payload?.status || "idle";
      const detail = payload?.detail || payload?.status || "Idle";
      const progress = estimatedExportProgress(payload);

      if (status === "idle") {
        ui.exportStatus.hidden = true;
        ui.exportStage.textContent = "Idle";
        ui.exportPercent.textContent = "0%";
        ui.exportProgressFill.style.width = "0%";

    }

    function formatPipelineElapsed(seconds) {

    function describePipelineStageStatus(status) {
      switch (String(status || "pending")) {
        case "running":
          return "Running";
        case "done":
          return "Done";
        case "skipped":
          return "Skipped";
        case "error":
          return "Error";
        default:
          return "Pending";

    function pipelineStageFillWidth(stage) {
      switch (String(stage?.status || "pending")) {

          return 100;

          return 0;

    function renderPipelineStatus(payload) {
      if (!ui.pipelineStatus) {
        return;
      }

      const stages = Array.isArray(payload?.stages) ? payload.stages : [];
      const status = String(payload?.status || "idle");
      const currentStage = stages.find((stage) => stage && stage.status === "running") || null;
      const finishedCount = stages.filter((stage) => stage && ["done", "skipped"].includes(stage.status)).length;
      const totalStages = stages.length || 1;
      const progress = Math.max(0, Math.min((finishedCount / totalStages) * 100, 100));
      const elapsed = currentStage
        ? formatPipelineElapsed(currentStage.elapsed_seconds || payload?.stage_elapsed_seconds || 0)
        : (status === "completed" ? formatPipelineElapsed(payload?.stage_elapsed_seconds || 0) : "0:00");
      const summaryStatus = status === "running"
        ? `Running: ${currentStage?.label || payload?.current_stage_label || "Pipeline"}`
        : status === "completed"
          ? "Pipeline complete"
          : status === "error"
            ? "Pipeline failed"
            : "Pipeline idle";

      ui.pipelineStage.textContent = summaryStatus;
      ui.pipelineElapsed.textContent = elapsed;
      ui.pipelineProgressFill.style.width = `${progress}%`;
      ui.pipelineDetail.textContent = status === "running"
        ? `${finishedCount}/${stages.length} stages done`
        : status === "completed"
          ? `${finishedCount}/${stages.length} stages done`
          : status === "error"
            ? (payload?.error || "The pipeline stopped with an error.")
            : "No pipeline running.";

      ui.pipelineStages.innerHTML = "";
      state.pipelineRunning = status === "running";
      ui.pipelineStages.hidden = status !== "running";
      if (ui.stopAiPass) {
        ui.stopAiPass.hidden = status !== "running";
      }
      if (status !== "running") {
        return;
      }

      stages.forEach((stage) => {
        const row = document.createElement("div");
        const stageStatus = String(stage?.status || "pending");
        row.className = `pipeline-stage ${stageStatus}`;

        const head = document.createElement("div");
        head.className = "pipeline-stage-head";

        const name = document.createElement("div");
        name.className = "pipeline-stage-name";
        name.textContent = stage?.label || stage?.key || "Stage";

        const meta = document.createElement("div");
        meta.className = "pipeline-stage-meta";

        const spinner = document.createElement("span");
        spinner.className = "pipeline-spin";

        const badge = document.createElement("span");
        badge.className = `pipeline-stage-status ${stageStatus}`;
        badge.textContent = String(stageStatus || "pending").toUpperCase();

        const elapsedValue = document.createElement("span");
        elapsedValue.textContent = ["running", "done"].includes(stageStatus)
          ? formatPipelineElapsed(stage?.elapsed_seconds || 0)
          : "";

        meta.append(spinner, badge);
        if (elapsedValue.textContent) {
          meta.append(elapsedValue);
        }

        head.append(name, meta);

        const bar = document.createElement("div");
        bar.className = "pipeline-stage-bar";
        const fill = document.createElement("div");
        fill.className = `pipeline-stage-fill ${stageStatus}`;
        fill.style.width = `${pipelineStageFillWidth(stage)}%`;
        bar.appendChild(fill);

        row.append(head, bar);
        ui.pipelineStages.appendChild(row);
      });
    }
