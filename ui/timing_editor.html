    function commitLyricsEdits(lineIndex, newValue, action, extra = {}) {
       const textLines = ui.lyricsText.value.split('\n');
       
       if (action === "update") {
           textLines[lineIndex] = newValue;
           const fullText = textLines.join("\n");
           ui.lyricsText.value = fullText;
           applyLyricsTextLocally(fullText);
       } else if (action === "split") {
           state.ignoreFocusRestoration = true;
           const { leftText, rightText } = extra;
           textLines[lineIndex] = leftText;
           textLines.splice(lineIndex + 1, 0, rightText);
           const fullText = textLines.join("\n");
           ui.lyricsText.value = fullText;
           applyLyricsTextLocally(fullText);
           state.ignoreFocusRestoration = false;
           
            setTimeout(() => {
                const newDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
                if (newDivs[lineIndex + 1]) {
                    setContentEditableCursorOffset(newDivs[lineIndex + 1], 0);
                }
            }, 10);
        } else if (action === "merge_up") {
           if (lineIndex <= 0) return;
           state.ignoreFocusRestoration = true;
           const prevText = textLines[lineIndex - 1] || "";
           const targetCursor = prevText.length;
           textLines[lineIndex - 1] = prevText + newValue;
           textLines.splice(lineIndex, 1);
           
           const fullText = textLines.join("\n");
           ui.lyricsText.value = fullText;
           applyLyricsTextLocally(fullText);
           state.ignoreFocusRestoration = false;
           
           setTimeout(() => {
                const newDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
                if (newDivs[lineIndex - 1]) {
                    setContentEditableCursorOffset(newDivs[lineIndex - 1], targetCursor);
                }
            }, 10);
        } else if (action === "merge_down") {
           if (lineIndex >= textLines.length - 1) return;
           state.ignoreFocusRestoration = true;
           const currentText = textLines[lineIndex] || "";
           const nextText = textLines[lineIndex + 1] || "";
           const targetCursor = currentText.length;
           textLines[lineIndex] = currentText + nextText;
           textLines.splice(lineIndex + 1, 1);
           
           const fullText = textLines.join("\n");
           ui.lyricsText.value = fullText;
           applyLyricsTextLocally(fullText);
           state.ignoreFocusRestoration = false;
           
           setTimeout(() => {
                const newDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
                if (newDivs[lineIndex]) {
                    setContentEditableCursorOffset(newDivs[lineIndex], targetCursor);
                }
           }, 10);
       }
    }

    function renderLyricsDrawer() {
      if (!state.drawerOpen || !ui.lyricsList) return;

      const lines = getResolvedLines();
      if (!lines.length) {
        ui.lyricsList.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--muted)">No lyrics found.</div>`;
        return;
      }

      // Record focus and cursor position for contenteditable divs
      let activeLineIndex = null;
      let activeCursorOffset = null;
      if (!state.ignoreFocusRestoration && document.activeElement && document.activeElement.classList.contains("lyrics-words")) {
        const wordsDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
        activeLineIndex = wordsDivs.indexOf(document.activeElement);
        if (activeLineIndex !== -1) {
          activeCursorOffset = getContentEditableCursorOffset(document.activeElement);
        }
      }

      const { activeIndex: audioActiveIndex } = findPreviewLines();

      if (state.clickedLineIndex >= 0) {
        const clickedLine = lines.find(l => l.index === state.clickedLineIndex);
        if (clickedLine && clickedLine.words.length > 0) {
          const lineEnd = clickedLine.words[clickedLine.words.length - 1].end;
          if ((ui.audio.currentTime || 0) > lineEnd + 1.5) {
            state.clickedLineIndex = -1;
          }
        } else {
          state.clickedLineIndex = -1;
        }
      }
      const activeIndex = state.clickedLineIndex >= 0 ? state.clickedLineIndex : audioActiveIndex;

      ui.lyricsList.innerHTML = "";
      lines.forEach((line) => {
        const lineEl = document.createElement("div");
        lineEl.className = "lyrics-line";
        if (line.index === activeIndex) {
          lineEl.classList.add("active");
        }

        const numEl = document.createElement("div");
        numEl.className = "lyrics-line-number";
        numEl.textContent = line.index + 1;

        // Contenteditable div with per-word spans
        const wordsDiv = document.createElement("div");
        wordsDiv.className = "lyrics-words";
        wordsDiv.contentEditable = "true";
        wordsDiv.dir = "rtl";

        const baseWords = line.allWords || [];
        if (baseWords.length > 0) {
          baseWords.forEach((baseWord, wi) => {
            const resolvedWord = state.resolvedWords.find(w => w.id === baseWord.id);
            const isCommitted = resolvedWord && Number.isFinite(resolvedWord.start);
            const wordSpan = document.createElement("span");
            wordSpan.className = `lyrics-word ${isCommitted ? "committed" : "uncommitted"}`;
            wordSpan.textContent = baseWord.text;
            wordsDiv.appendChild(wordSpan);
            if (wi < baseWords.length - 1) {
              wordsDiv.append(" ");
            }
          });
        } else {
          wordsDiv.textContent = line.text || "";
          wordsDiv.style.color = "var(--muted)";
        }

        // Keyboard navigation and editing
        wordsDiv.addEventListener("keydown", (e) => {
          const val = wordsDiv.textContent || "";
          const selStart = getContentEditableCursorOffset(wordsDiv) || 0;

          if (e.key === "Enter") {
             e.preventDefault();
             const leftText = val.substring(0, selStart);
             const rightText = val.substring(selStart);
             commitLyricsEdits(line.index, null, "split", { leftText, rightText });
          } else if (e.key === "Backspace" && selStart === 0) {
             e.preventDefault();
             commitLyricsEdits(line.index, val, "merge_up");
          } else if (e.key === "Delete" && selStart >= val.length) {
             e.preventDefault();
             commitLyricsEdits(line.index, null, "merge_down");
          } else if (e.key === "ArrowUp") {
             const allDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
             const targetDiv = allDivs[line.index - 1];
             if (targetDiv) {
               e.preventDefault();
               const pos = Math.min(selStart, (targetDiv.textContent || "").length);
               setContentEditableCursorOffset(targetDiv, pos);
             }
          } else if (e.key === "ArrowDown") {
             const allDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
             const targetDiv = allDivs[line.index + 1];
             if (targetDiv) {
               e.preventDefault();
               const pos = Math.min(selStart, (targetDiv.textContent || "").length);
               setContentEditableCursorOffset(targetDiv, pos);
             }
          }
        });

        // Real-time update on input
        wordsDiv.addEventListener("input", () => {
          commitLyricsEdits(line.index, wordsDiv.textContent || "", "update");
        });

        wordsDiv.addEventListener("blur", () => {
          const newText = wordsDiv.textContent || "";
          if (newText !== line.text) {
            commitLyricsEdits(line.index, newText, "update");
          }
        });

        wordsDiv.addEventListener("click", (e) => {
          e.stopPropagation();
        });

        lineEl.appendChild(numEl);
        lineEl.appendChild(wordsDiv);

        // Line number click — seek + scroll to line
        numEl.addEventListener("click", (e) => {
          e.stopPropagation();
          state.clickedLineIndex = line.index;
          const firstPlacedWord = line.words && line.words[0];
          if (firstPlacedWord && Number.isFinite(firstPlacedWord.start)) {
             const targetIndex = state.resolvedWords.findIndex(w => w.id === firstPlacedWord.id);
             if (targetIndex !== -1) {
                setSelectedWord(targetIndex, { seek: true });
             } else {
                const safeStart = Math.max(0, firstPlacedWord.start - 0.05);
                setPlayheadTime(safeStart);
                setWindowAround(safeStart);
                renderAll();
             }
             lineEl.scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
             updateStatusChip(ui.projectStatus, "Line has no committed words — place words first.", "warn");
          }
        });

        ui.lyricsList.appendChild(lineEl);
      });

      // Restore cursor position after re-render
      if (activeLineIndex !== null) {
        const wordsDivs = Array.from(ui.lyricsList.querySelectorAll(".lyrics-words"));
        const targetDiv = wordsDivs[activeLineIndex];
        if (targetDiv) {
          setContentEditableCursorOffset(targetDiv, activeCursorOffset);
        }
      }

    }

                    ui.lyricsPreview.hidden = false;
                    showLyricsResult(0);
                    updateStatusChip(ui.projectStatus, `Fetched from ${r.domain || "URL"}`, "ok");
                  } else {
                    updateStatusChip(ui.projectStatus, "No lyrics found at that URL.", "warn");
                  }
                } catch (err) {
                  updateStatusChip(ui.projectStatus, err.message, "warn");
                }
                row.style.opacity = "1";
              });
              const badge = document.createElement("span");
              const domain = r.domain || "link";
              badge.style.cssText = "padding:1px 5px;border-radius:6px;background:rgba(255,255,255,0.08);color:var(--muted);font-size:10px;white-space:nowrap;";
              badge.textContent = domain;
              const text = document.createElement("span");
              text.style.cssText = "flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;";
              text.textContent = r.title || r.href;
              row.append(badge, text);
              container.appendChild(row);
            });
          } catch (error) {
            updateStatusChip(ui.projectStatus, error.message, "warn");
          } finally {
            ui.manualDdgBtn.disabled = false;
            ui.manualDdgBtn.textContent = "Search DDG";
          }
        });
      }
      if (ui.manualFetchUrlBtn) {
        ui.manualFetchUrlBtn.addEventListener("click", async () => {
          const url = ui.manualSearchQuery.value.trim();
          if (!url || !url.startsWith("http")) {
            updateStatusChip(ui.projectStatus, "Enter a valid URL to fetch.", "warn");
            return;
          }
          ui.manualFetchUrlBtn.disabled = true;
          ui.manualFetchUrlBtn.textContent = "Fetching...";
          try {
            const res = await fetchJson("/api/lyrics/fetch_url", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({url, song: "", artist: ""}),
            });
            if (res.lyrics_text) {
              state.fetchResults = [{
                source: res.source || "unknown",
                source_url: res.source_url || url,
                lyrics_text: res.lyrics_text,
                success: true,
                error: "",
                discovery_method: "manual",
                extraction_method: res.extraction_method || "selector",
              }];
              state.fetchResultIndex = -1;
              ui.lyricsPreview.hidden = false;
              showLyricsResult(0);
              updateStatusChip(ui.projectStatus, "URL fetched successfully.", "ok");
            } else {
              updateStatusChip(ui.projectStatus, res.error || "No lyrics found.", "warn");
            }
          } catch (error) {
            updateStatusChip(ui.projectStatus, error.message, "warn");
          } finally {
            ui.manualFetchUrlBtn.disabled = false;
            ui.manualFetchUrlBtn.textContent = "Fetch from URL";
          }
        });
      }
      if (ui.manualLlmBtn) {
        ui.manualLlmBtn.addEventListener("click", async () => {
          const idx = state.fetchResultIndex;
          const url = (idx >= 0 && state.fetchResults && state.fetchResults[idx])
            ? state.fetchResults[idx].source_url : "";
          if (!url) {
            updateStatusChip(ui.projectStatus, "No source URL available. Search or fetch a URL first.", "warn");
            return;
          }
          const title = (ui.projectTitle?.value || ui.projectName?.value || "").trim();
          const parts = title.split(" - ");
          const song = parts.length >= 2 ? parts[0] : title;
          const artist = parts.length >= 2 ? parts[1] : "";
          ui.manualLlmBtn.disabled = true;
          ui.manualLlmBtn.textContent = "LLM extracting...";
          try {
            const res = await fetchJson("/api/lyrics/llm_extract", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({url, song, artist}),
            });
            if (res.lyrics_text) {
              state.fetchResults = [{
                source: "LLM extraction",
                source_url: url,
                lyrics_text: res.lyrics_text,
                success: true,
                error: "",
                discovery_method: "manual",
                extraction_method: "llm",
              }];
              state.fetchResultIndex = -1;
              ui.lyricsPreview.hidden = false;
              showLyricsResult(0);
              updateStatusChip(ui.projectStatus, "LLM extracted lyrics.", "ok");
            } else {
              updateStatusChip(ui.projectStatus, res.error || "LLM could not extract lyrics.", "warn");
            }
          } catch (error) {
            updateStatusChip(ui.projectStatus, error.message, "warn");
          } finally {
            ui.manualLlmBtn.disabled = false;
            ui.manualLlmBtn.textContent = "LLM Extract";
          }
        });
      }
      if (ui.closeDrawer) {
        ui.closeDrawer.addEventListener("click", toggleDrawer);
      }
      document.querySelectorAll(".drawer-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".drawer-tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          document.querySelectorAll(".drawer-tab-content").forEach((c) => c.hidden = true);
          const target = document.getElementById(`tab${tab.dataset.tab.replace(/^./, (c) => c.toUpperCase())}`);
          if (target) target.hidden = false;
        });
      });
      if (ui.toggleLeft) {
        ui.toggleLeft.addEventListener("click", toggleLeftRail);
      }
      if (ui.toggleRight) {
        ui.toggleRight.addEventListener("click", toggleDrawer);
      }
      ui.deleteProject.addEventListener("click", deleteProject);
      ui.resetWord.addEventListener("click", resetSelectedSuffix);
      // resetAll button removed
      ui.waveCanvas.addEventListener("click", seekFromWaveform);
      ui.wavePan.addEventListener("input", (event) => {
        panWaveformWindow(Number(event.target.value || 0));
      });
      ui.playhead.addEventListener("pointerdown", beginPlayheadDrag);
      document.addEventListener("keydown", handleEditorShortcut);

      ["timeupdate", "seeked", "loadedmetadata", "durationchange", "play", "pause"].forEach((eventName) => {
        ui.audio.addEventListener(eventName, queueRender);
      });
      ["seeked", "play"].forEach((eventName) => {
        ui.audio.addEventListener(eventName, () => syncStemPlayback({ force: true }));
      });
      ui.audio.addEventListener("pause", pauseStemPlayers);
      ui.audio.addEventListener("ratechange", () => {
        ui.vocalsAudio.playbackRate = ui.audio.playbackRate || 1;
        ui.musicAudio.playbackRate = ui.audio.playbackRate || 1;
      });
      ui.vocalsAudio.addEventListener("loadedmetadata", refreshStemAvailability);
      ui.musicAudio.addEventListener("loadedmetadata", refreshStemAvailability);
      ui.vocalsAudio.addEventListener("error", refreshStemAvailability);
      ui.musicAudio.addEventListener("error", refreshStemAvailability);

      window.addEventListener("resize", queueRender);
    }

    bindEvents();
    state.stemMixValue = 0;
    if (ui.stemMix) {
      ui.stemMix.value = "0";
    }
    applyStemMix();
    renderAll();
    renderSetupInput("youtube");
    loadProject({ bustCache: true }).catch((error) => {
      updateStatusChip(ui.projectStatus, error.message, "warn");
      renderAll();
    });
  </script>
</body>
</html>
